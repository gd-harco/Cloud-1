---
- name : uploader et deployer la webapp
  hosts: ovh
  become: yes
  become_user: "debian"
  vars:
    distant_path: "/home/debian/webapp/"

  tasks:

    - name: Copy file to the instance
      ansible.builtin.copy:  
        dest: "{{distant_path}}"
        src: "./webapp/"
        owner: "debian"

    # - name: send the site archive
    #   ansible.builtin.copy:  
    #     dest: "/home/debian/"
    #     src: "./data.tar.gz"
    #     owner: "debian"

    - name: Extract the archive
      ansible.builtin.unarchive:
        src: "./data.tar.gz"
        dest: "/home/debian/"

    - name: Up the webapp
      community.docker.docker_compose_v2:
        build: always
        project_src: "{{distant_path}}"