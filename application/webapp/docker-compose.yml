services:
  wordpress:
    image: wordpress
    restart: always
    env_file: ./.env
    volumes:
      - WordPress:/var/www/html
    networks:
      - inception_nw
      - wordpress_nw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      - "traefik.http.routers.wordpress.tls=true"
      - "traefik.http.routers.wordpress.rule=Host(`cloud-1.ft-server.fr`)"
    user: "33"

  wp-cli:
    image: wordpress:cli
    container_name: wp-cli
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - wordpress_nw
    env_file: ./.env
    volumes:
      - WordPress:/var/www/html
    command: >
      /bin/sh -c 'wp core install --path="/var/www/html" --url=$WORDPRESS_URL --title="$WORDPRESS_TITLE" --admin_user=$WORDPRESS_ADMIN_USER --admin_password=$WORDPRESS_ADMIN_PASS --admin_email=$WORDPRESS_ADMIN_MAIL'
    user: "33"

  db:
    image: mysql:8.0
    restart: always
    env_file: ./.env
    volumes:
      - DataBase:/var/lib/mysql
    networks:
      - wordpress_nw
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "$$MYSQL_USER",
          "--password=$$MYSQL_PASSWORD",
        ]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 55

volumes:
  WordPress:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: /home/debian/data/wordpress
  DataBase:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: /home/debian/data/mariadb

networks:
  inception_nw:
    external: true
  wordpress_nw:
