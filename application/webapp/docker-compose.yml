  #     - inception
  #   volumes:
  #     - WordPress:/var/www/html


  wordpress:
    image: wordpress
    restart: always
    ports:
      - 8080:80
    env_file: ./.env
    volumes:
      - WordPress:/var/www/html

  db:
    image: mysql:8.0
    restart: always
    env_file: ./.env
    volumes:
      - DataBase:/var/lib/mysql


volumes:
  WordPress:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: /home/debian/data/wordpress
  DataBase:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: /home/debian/data/mariadb

networks:
  inception:
    name: inception
    driver: bridge
